---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: targeting-service-secret
