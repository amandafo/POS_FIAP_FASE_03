apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: auth-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/homolog/auth-db
        property: DATABASE_URL
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/homolog/application
        property: MASTER_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-service
