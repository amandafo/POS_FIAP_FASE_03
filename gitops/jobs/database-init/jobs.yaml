apiVersion: batch/v1
kind: Job
metadata:
  name: init-auth-db
  namespace: togglemaster
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-auth-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["sh", "-ec"]
          args:
            - psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --set=service_api_key="$SERVICE_API_KEY" --file=/sql/auth-init.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-application-secret
                  key: SERVICE_API_KEY
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: sql
          configMap:
            name: database-init-sql
