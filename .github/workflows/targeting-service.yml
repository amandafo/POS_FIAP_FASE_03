name: targeting-service
on:
  pull_request:
    paths: ["targeting-service/**", ".github/workflows/**", "scripts/update-gitops-image.sh"]
  push:
    branches: [main]
    paths: ["targeting-service/**", ".github/workflows/**", "scripts/update-gitops-image.sh"]
permissions:
  contents: write
jobs:
  pipeline:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: targeting-service
      language: python
    secrets: inherit
