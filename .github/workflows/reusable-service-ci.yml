name: reusable-service-ci

on:
  workflow_call:
    inputs:
      service:
        description: Diretorio e nome do microsservico
        required: true
        type: string
      language:
        description: go ou python
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_SESSION_TOKEN: { required: true }
      AWS_REGION: { required: true }

permissions:
  contents: write

concurrency:
  group: gitops-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devsecops:
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ inputs.service }}
      LOCAL_IMAGE: ${{ inputs.service }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Testes Go
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service }}
        run: go test -race -cover ./...

      - name: Lint Go
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ inputs.service }}

      - name: SAST Go
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -severity medium -confidence medium ./...

      - name: Preparar Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ inputs.service }}/requirements.txt

      - name: Testes, lint e SAST Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.service }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest ruff bandit
          pytest -q
          ruff check .
          bandit -q -r . -x ./tests

      - name: SCA de dependencias
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build da imagem
        run: docker build --tag "$LOCAL_IMAGE" "$SERVICE"

      - name: Scan da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagem por SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "$LOCAL_IMAGE" "$ECR_REGISTRY/$SERVICE:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/$SERVICE:${GITHUB_SHA}"

      - name: Atualizar GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          ./scripts/update-gitops-image.sh "$SERVICE" "$ECR_REGISTRY" "$GITHUB_SHA"
          if git diff --quiet; then
            echo "GitOps ja usa este SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "gitops/apps/$SERVICE/kustomization.yaml"
          git commit -m "chore(gitops): atualiza $SERVICE para ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Nao foi possivel publicar a atualizacao GitOps apos cinco tentativas." >&2
          exit 1
